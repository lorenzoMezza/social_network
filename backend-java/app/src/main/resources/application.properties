# The port comes from PORT (Main), 7777 in development: the app finds it by itself
spring.main.banner-mode=off
spring.application.name=masterkey
# Every request on a virtual thread (JAVA-BACKEND.md §21)
spring.threads.virtual.enabled=true
# Errors are {code, message} only (Errors, JsonErrorHandler): nothing of Spring's own
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.include-path=never
# Answers over 1 KB compressed when the client accepts it (API.md, Conventions)
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json
# Closing waits for the requests under way
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.jetty.max-http-form-post-size=0
# Never a URL with its query in a log (API.md, Security): no access log here
logging.level.root=INFO
logging.level.org.eclipse.jetty=WARN
logging.level.org.springframework=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.jooq=WARN
